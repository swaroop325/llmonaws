global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance_id']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 15m

receivers:
  - name: 'default'
    # Configure your notification channel:
    # webhook_configs:
    #   - url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     send_resolved: true

  - name: 'critical'
    # webhook_configs:
